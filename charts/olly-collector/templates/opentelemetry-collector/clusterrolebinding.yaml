{{ if .Values.opentelemetryCollector.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-opentelemetry-collector
  labels:
    {{- include "olly-collector.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "olly-collector.name" . }}-opentelemetry-collector
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-opentelemetry-collector
  apiGroup: rbac.authorization.k8s.io
{{ end }}