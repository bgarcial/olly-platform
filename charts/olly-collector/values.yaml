global:
  # The name of the cluster
  # Must uniquely identify the Kubernetes cluster
  #
  # For example:
  # cluster: stp-str-tst
  cluster: olly-do-nonprd

  tempo:
    # otlp (gRPC) exporter — bare host:port, no scheme, no path.
    # tempo-eu-west-0.grafana.net:443 is the Grafana Cloud Tempo gRPC endpoint.
    # Do NOT add https:// — that format is for otlphttp; gRPC requires bare host:port.
    endpoint: "tempo-eu-west-0.grafana.net:443"
  
  mimir:
    # https://grafana.com/docs/mimir/latest/configure/configure-otel-collector/
    # otlp_http exporter will append /v1/metrics 
    # https://github.com/open-telemetry/opentelemetry-collector/blob/main/exporter/otlphttpexporter/README.md#otlp-http-exporter
    endpoint: "https://prometheus-prod-01-eu-west-0.grafana.net/otlp"
  
  loki:
    endpoint: "https://logs-prod-eu-west-0.grafana.net/otlp"

  opentelemetry:
    # The OpenTelemetry endpoint to send opentelemetry logs, traces and metrics to
    # For example when it comes to htttps in the case the endpoint is being exposed through an Ingress with TLS termination
    # endpoint: https://otlp-http-<personal.olly.nonprd.<mydomain>:443

    # For grafana cloud Otel gateway unified endpoint
    # https://grafana.com/orgs/bgarcial/stacks/308241/otlp-info
    # endpoint: "https://otlp-gateway-prod-eu-west-0.grafana.net/otlp"
    endpoint: ""

opentelemetryCollector:
  enabled: true
  image: otel/opentelemetry-collector-k8s:0.134.1

  # Deploy Vertical Pod Autoscaler first
  # https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler 
  vpa:
    enabled: true

  # Automatic instrumentation of client libraries
  # Ref: https://opentelemetry.io/docs/kubernetes/operator/automatic/
  instrumentation:
    # Deploy cluster policy to inject Instrumentation resources
    # Deploy Kyverno and then add the cluster policy to inject Instrumentation resources over all namespaces
    enabled: true
    # The namespaces where to enable autoinstrumentation. Defaults to all namespaces
    namespaces: []
  resources:
    limits:
      memory: 500Mi
    requests:
      cpu: 250m
      memory: 500Mi
  serviceMonitor:
    labels:
      prometheus: main-prometheus
  # processors.filter/drop_noisy_trace_urls: Original from: https://nais.io/blog/posts/otel-from-0-to-100/
  # processors.k8sattributes: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/k8sattributesprocessor/README.md
  # processors.memory_limiter: https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/memorylimiterprocessor/README.md
  config:
    receivers:
      # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/filelogreceiver
      filelog:
        include:
          - /var/log/pods/**/*.log
        include_file_path: true 
        start_at: end
        # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/pkg/stanza/docs/operators/README.md#what-operators-are-available
        operators:
          - id: container-parser
            type: container
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      kubeletstats:
        collection_interval: 60s
        auth_type: "serviceAccount"
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        node: '${env:KUBE_NODE_NAME}'
        insecure_skip_verify: true
        metric_groups: [ container, pod, node, volume ]
        # Required for *.node.utilization metrics — enables the receiver
        # to query the Kubernetes API for node capacity (Status.Capacity)
        k8s_api_config:
          auth_type: serviceAccount
        metrics:
          container.uptime:
            enabled: true
          k8s.container.cpu.node.utilization:
            enabled: true
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.cpu_request_utilization:
            enabled: true
          k8s.container.memory.node.utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.container.memory_request_utilization:
            enabled: true
          k8s.node.uptime:
            enabled: true
          k8s.pod.cpu.node.utilization:
            enabled: true
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory.node.utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          k8s.pod.uptime:
            enabled: true
          # When I upgrade the collector version
          # k8s.pod.volume.usage:
          #   enabled: true 
    exporters:
      # Use debug for testing as I don't have an otlp endpoint yet.
      # https://github.com/open-telemetry/opentelemetry-collector/blob/main/exporter/debugexporter/README.md#getting-started
      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200
      
      # https://grafana.com/docs/alloy/latest/collect/opentelemetry-to-lgtm-stack/#grafana-tempo
      # OTLP/gRPC — persistent connection; keepalive prevents connection resets by load balancers.
      # endpoint must be bare host:port, no scheme (gRPC handles TLS separately via tls block).
      otlp/traces:
        auth:
          authenticator: basicauth/tempo
        endpoint: "{{ .Values.global.tempo.endpoint }}"
        tls:
          insecure: false
        keepalive:
          time: 30s
          timeout: 10s
          permit_without_stream: true
      
      otlphttp/metrics:
        auth:
          authenticator: basicauth/mimir
        endpoint: "{{ .Values.global.mimir.endpoint }}"
        tls:
          insecure: false
        compression: gzip
        encoding: proto
        # Check other attributes for auth retries compression for reducing egress costs
      
      otlphttp/logs:
        auth:
          authenticator: basicauth/loki
        endpoint: "{{ .Values.global.loki.endpoint }}"
        tls:
          insecure: false

    extensions:
      basicauth/tempo:
        client_auth:
          username: "${env:GRAFANA_CLOUD_TEMPO_USER}"
          password: "${env:GRAFANA_CLOUD_TOKEN}"
      basicauth/mimir:
        client_auth:
          username: "${env:GRAFANA_CLOUD_MIMIR_USER}"
          password: "${env:GRAFANA_CLOUD_TOKEN}"
      basicauth/loki:
        client_auth:
          username: "${env:GRAFANA_CLOUD_LOKI_USER}"
          password: "${env:GRAFANA_CLOUD_TOKEN}"
      health_check:
        endpoint: "0.0.0.0:13133"
    
    processors:
      batch:
        send_batch_size: 1000
        timeout: 10s
      filter/drop_noisy_trace_urls:
        error_mode: ignore
        traces:
          span:
            # Drop spans for metric/health endpoints
            # Called by Kubernetes (readiness/liveness probes)
            # Prometheus scrapping metrics
            # Spring Boot Application Internal health checks - actuator
            # Load Balancers and Ingress Controllers 
            - |
              (attributes["http.method"] == "GET" or attributes["http.request.method"] == "GET") and (
                    attributes["http.route"] == "/favicon.ico"               or attributes["http.target"] == "/favicon.ico"                 or attributes["url.path"] == "/favicon.ico"
                or IsMatch(attributes["http.route"], ".*[iI]s_?[rR]eady")    or IsMatch(attributes["http.target"], ".*[iI]s_?[rR]eady")     or IsMatch(attributes["url.path"], ".*[iI]s[rR]eady")
                or IsMatch(attributes["http.route"], ".*[iI]s_?[aA]live")    or IsMatch(attributes["http.target"], ".*[iI]s_?[aA]live")     or IsMatch(attributes["url.path"], ".*[iI]s[aA]live")
                or IsMatch(attributes["http.route"], ".*prometheus")         or IsMatch(attributes["http.target"], ".*prometheus")          or IsMatch(attributes["url.path"], ".*prometheus")
                or IsMatch(attributes["http.route"], ".*metrics")            or IsMatch(attributes["http.target"], ".*metrics")             or IsMatch(attributes["url.path"], ".*metrics")
                or IsMatch(attributes["http.route"], ".*actuator.*")         or IsMatch(attributes["http.target"], ".*actuator.*")          or IsMatch(attributes["url.path"], ".*actuator.*")
                or IsMatch(attributes["http.route"], ".*internal/health.*")  or IsMatch(attributes["http.target"], ".*internal/health.*")   or IsMatch(attributes["url.path"], ".*internal/health.*")
                or IsMatch(attributes["http.route"], ".*internal/status.*")  or IsMatch(attributes["http.target"], ".*internal/status.*")   or IsMatch(attributes["url.path"], ".*internal/status.*")
                or IsMatch(attributes["http.route"], ".*/readyz?")           or IsMatch(attributes["http.target"], ".*/readyz?")            or IsMatch(attributes["url.path"], ".*/readyz?")
                or IsMatch(attributes["http.route"], ".*/healthz?")          or IsMatch(attributes["http.target"], ".*/healthz?")           or IsMatch(attributes["url.path"], ".*/healthz?")
              )
      k8sattributes:
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.statefulset.name
            - k8s.cronjob.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.container.name
        filter:
          node_from_env_var: KUBE_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - action: insert
            key: k8s.cluster.name
            value: "{{ .Values.global.cluster }}"
      # Promote k8s.node.name from resource attribute to datapoint attribute
      # so it becomes a Prometheus label in Mimir. It is needed for node-level metrics
      # from kubeletstats — the k8sattributes processor can't enrich these
      # (no pod to match), and Mimir Cloud doesn't auto-promote all resource attributes.
      # https://grafana.com/blog/opentelemetry-with-prometheus-better-integration-through-resource-attribute-promotion/#enabling-resource-attribute-promotion
      transform/promote_node_name:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["k8s.node.name"], resource.attributes["k8s.node.name"]) where resource.attributes["k8s.node.name"] != nil
    service:
      telemetry:
        logs:
          encoding: json
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: '0.0.0.0'
                    port: 8888
      extensions:
        - health_check
        - basicauth/tempo
        - basicauth/mimir
        - basicauth/loki
      pipelines:
        metrics:
          exporters:
            - debug
            - otlphttp/metrics
          processors:
            - memory_limiter
            - k8sattributes
            - batch
            - resource
            - transform/promote_node_name
          receivers:
            - otlp
            - kubeletstats
        traces:
          exporters:
            - debug
            - otlp/traces
          processors:
            - memory_limiter
            - filter/drop_noisy_trace_urls
            - k8sattributes
            - batch
            - resource
          receivers:
            - otlp
        logs:
          exporters:
            - otlphttp/logs
          processors:
            - memory_limiter
            - k8sattributes
            - batch
            - resource
          receivers:
            - filelog

opentelemetry-operator:
  enabled: true
  fullnameOverride: opentelemetry-operator

  replicaCount: 2

  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: 1

  ## Provide OpenTelemetry Operator manager container image and resources.
  manager:
    # Enable manager pod automatically rolling
    rolling: true

    # https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-operator/UPGRADING.md#0553-to-0560
    collectorImage:
      repository: otel/opentelemetry-collector-k8s

    autoInstrumentation:
      go:
        enabled: true

    featureGates: ""
    extraArgs:
      - --enable-multi-instrumentation
      - --enable-nginx-instrumentation=true

    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 256Mi

    # Deploy Vertical Pod Autoscaler first
    # https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler 
    verticalPodAutoscaler:
      enabled: true
      # https://github.com/open-telemetry/opentelemetry-operator/issues/2667
      # Operator needed more resources to solve the above issue.
      minAllowed:
        cpu: 200m 
        memory: 512Mi
      updatePolicy:
        minReplicas: 1
        updateMode: Auto

    # TBD - Deploy Prometheus Operator to get the ServiceMonitor CRD
    serviceMonitor:
      enabled: false

  ## Admission webhooks make sure only requests with correctly formatted rules will get into the Operator.
  ## They also enable the sidecar injection for OpenTelemetryCollector and Instrumentation CR's
  ## Deploy Cert Manager first - https://cert-manager.io/docs/installation/helm/#installing-from-the-oci-registry
  admissionWebhooks:
    certManager:
      enabled: true

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-operator
              app.kubernetes.io/component: controller-manager
          topologyKey: kubernetes.io/hostname

  # Think about toleration if I happen to have taints or add them
  tolerations: []
